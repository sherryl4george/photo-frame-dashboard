<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2EEE6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/shop.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Shopping</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <header class="top">
    <div class="title"><h1>Shopping</h1><span id="status" class="status" title="Connection"></span>
      <span class="grow"></span>
      <button id="layoutbtn" class="iconbtn" aria-label="Switch between large tiles and a compact list" title="Tiles / compact list"></button>
      <button id="searchbtn" class="iconbtn" aria-label="Search the list">🔍</button>
      <button id="menubtn" class="iconbtn" aria-label="Menu">⋮</button>
    </div>
    <nav id="tabs" class="tabs" aria-label="Shops"></nav>
    <input id="search" class="search" type="search" placeholder="Search the list" aria-label="Search the list" hidden>
  </header>
  <p id="banner" class="banner" hidden></p>
  <main id="list" class="list" aria-live="polite"></main>
  <footer class="addbar">
    <div id="recent" class="usuals"></div>
    <div id="suggest" class="suggest" hidden></div>
    <form id="addform" class="addform" autocomplete="off">
      <input id="addin" type="text" enterkeyhint="done" placeholder="Add an item  (Milk, 2 liters)" aria-label="Add an item" maxlength="100" autocapitalize="sentences">
      <button type="submit" aria-label="Add">Add</button>
    </form>
  </footer>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/js/shop.js"></script>
</body>
</html>
